version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: hospital-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SAPASSWORD@123"
    ports:
      - "14330:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo 'SELECT 1' | /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'SAPASSWORD@123' -C"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always

  auth-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.AuthService
    ports:
      - "5001:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HospitalAuthDb;User Id=sa;Password=SAPASSWORD@123;TrustServerCertificate=True;"
      Jwt__Key: "HospitalManagementSystemJwtSecretKey2026SecureKey!!"
      Jwt__Issuer: "HospitalAuthService"
      Jwt__Audience: "HospitalMicroservices"
    depends_on:
      sqlserver:
        condition: service_healthy

  doctor-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.DoctorService
    ports:
      - "5002:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HospitalDoctorDb;User Id=sa;Password=SAPASSWORD@123;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  patient-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.PatientService
    ports:
      - "5003:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HospitalPatientDb;User Id=sa;Password=SAPASSWORD@123;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  appointment-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.AppointmentService
    ports:
      - "5004:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HospitalAppointmentDb;User Id=sa;Password=SAPASSWORD@123;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  bed-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.BedService
    ports:
      - "5005:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HospitalBedDb;User Id=sa;Password=SAPASSWORD@123;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  discharge-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.DischargeService
    ports:
      - "5006:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HospitalDischargeDb;User Id=sa;Password=SAPASSWORD@123;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

  staff-service:
    build:
      context: .
      dockerfile: dockerfiles/Dockerfile.StaffService
    ports:
      - "5007:8080"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=HospitalStaffDb;User Id=sa;Password=SAPASSWORD@123;TrustServerCertificate=True;"
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sql_data: